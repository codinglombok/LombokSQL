# Mandiri sementara (TD-P0-08): ganti dengan pemanggil lombok-ci.yml dari codinglombok/.github.
# Action di-pin ke SHA (diambil dari remote GitHub 2026-10-07); Dependabot memperbaruinya.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: typescript
      - run: npm run typecheck
        working-directory: typescript
      - run: npm test
        working-directory: typescript
      - name: coverage gate (lines >= 90%)
        if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        run: npm run coverage
        working-directory: typescript
      - run: npm pack --dry-run
        working-directory: typescript
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (cabang)
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: thumbv7em-none-eabi
      - run: cargo fmt --check
        working-directory: rust
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test
        working-directory: rust
      - run: cargo build --no-default-features
        working-directory: rust
      - name: no_std on a bare-metal target (GP-4)
        run: cargo build --no-default-features --target thumbv7em-none-eabi
        working-directory: rust
      - run: cargo publish --dry-run --allow-dirty
        working-directory: rust
  mutation:
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci && npm run build && npx tsc -p tsconfig.test.json
        working-directory: typescript
      - run: node scripts/mutation-test.mjs
  integration:
    # Menjalankan SQL hasil kompilasi pada mesin sungguhan dan membandingkan HASIL (integration/run.mjs).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: lsql
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: lsql
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: typescript
      - run: npm ci
        working-directory: integration
      - run: node --disable-warning=ExperimentalWarning run.mjs
        working-directory: integration
        env:
          PG_URL: postgres://postgres:pw@127.0.0.1:5432/lsql
          MYSQL_URL: mysql://root:pw@127.0.0.1:3306/lsql
  integration-mssql:
    # BELUM PERNAH DIJALANKAN (TD-13). continue-on-error agar hasil pertama tidak memblokir; hapus setelah hijau.
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Lombok-Test-2026!"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Lombok-Test-2026!' -Q 'select 1'" --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: typescript
      - run: npm ci
        working-directory: integration
      - run: node --disable-warning=ExperimentalWarning run.mjs
        working-directory: integration
        env:
          MSSQL_URL: "Server=127.0.0.1,1433;Database=master;User Id=sa;Password=Lombok-Test-2026!;TrustServerCertificate=true"
